<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwnerRadar — Joe's Pizza</title>
    <meta
      name="description"
      content="OwnerRadar command center for Joe's Pizza — live locations, KPIs, and owner attention."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="radar-grid"></div>
      <div class="glow glow-a"></div>
    </div>

    <div class="sr-live" data-sr-live aria-live="polite" aria-atomic="true"></div>

    <header class="command-header" data-command-header>
      <div class="command-brand">
        <a class="brand-mark" href="../">OwnerRadar</a>
        <span class="divider" aria-hidden="true">/</span>
        <div class="business-selector" title="Business">
          <span class="business-name">Joe's Pizza</span>
          <span class="business-meta">10 locations</span>
        </div>
      </div>

      <div class="command-status" data-network-status>
        <span class="live-dot" aria-hidden="true"></span>
        <span data-status-label>Connecting…</span>
      </div>

      <p class="command-time" data-as-of>Connecting…</p>

      <label class="command-search">
        <span class="sr-only">Command search</span>
        <input
          type="search"
          data-command-input
          placeholder="Search locations, orders, alerts…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>

      <div class="command-actions">
        <details class="user-menu">
          <summary class="user-menu-trigger" aria-label="User menu">Owner</summary>
          <div class="user-menu-panel">
            <p>Signed in as owner</p>
            <a href="../">Back to OwnerRadar</a>
          </div>
        </details>
      </div>
    </header>

    <main class="app-shell">
      <section
        class="executive-kpis"
        data-executive-kpis
        aria-label="Executive KPIs"
      ></section>

      <div class="tile-stack" data-tile-stack>
        <div data-tile-locations></div>
        <div data-tile-orders></div>
        <div data-tile-attention></div>

        <details class="more-ops" data-more-ops>
          <summary class="more-ops-summary">
            More operations
            <span class="more-ops-hint">inventory · labor · phone · delivery · utilities</span>
          </summary>
          <div class="more-ops-body">
            <div data-tile-inventory></div>
            <div data-tile-labor></div>
            <div data-tile-phone></div>
            <div data-tile-discounts></div>
            <div data-tile-delivery></div>
            <div data-tile-utilities></div>
          </div>
        </details>
      </div>
    </main>

    <div
      class="drawer-root"
      data-drawer-root
      hidden
      aria-hidden="true"
    >
      <div class="drawer-backdrop" data-drawer-backdrop tabindex="-1"></div>
      <aside
        class="detail-drawer"
        data-drawer-panel
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
        tabindex="-1"
      >
        <div class="drawer-chrome">
          <h2 id="drawer-title" data-drawer-title>Details</h2>
          <button type="button" class="btn btn-ghost btn-icon" data-drawer-close aria-label="Close detail panel">
            Close
          </button>
        </div>
        <div class="drawer-body" data-drawer-body></div>
      </aside>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
