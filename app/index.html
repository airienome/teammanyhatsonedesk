<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OwnerRadar — Joe's Pizza Command Center</title>
    <meta
      name="description"
      content="OwnerRadar command center for Joe's Pizza locations, KPIs, and the 300-pizza Wynwood hackathon demo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="radar-grid"></div>
      <div class="glow glow-a"></div>
    </div>

    <header class="app-top">
      <div class="brand-lockup">
        <a class="back" href="../">OwnerRadar</a>
        <span class="divider" aria-hidden="true">/</span>
        <h1>Joe's Pizza</h1>
      </div>
      <div class="app-top-meta">
        <p data-as-of></p>
        <p class="open-badge">Hackathon supplier demo · no login</p>
      </div>
    </header>

    <main class="app-shell">
      <section class="demo-rail" data-demo aria-label="Live demo path"></section>

      <section class="group-strip" data-group-strip aria-label="Group KPIs"></section>

      <section class="orders-panel" data-orders-panel aria-label="Orders and cases"></section>

      <div class="workspace">
        <section class="stores-panel" aria-labelledby="stores-heading">
          <div class="panel-head">
            <h2 id="stores-heading">Locations</h2>
            <p>
              Live Neon Postgres · Joe's network ·
              <a href="https://www.joespizzanyc.com/locations" target="_blank" rel="noopener"
                >joespizzanyc.com/locations</a
              >
            </p>
          </div>
          <div class="store-grid" data-store-grid></div>
          <div class="store-detail" data-store-detail></div>
        </section>

        <aside class="attention-panel" data-attention aria-label="Owner attention"></aside>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
